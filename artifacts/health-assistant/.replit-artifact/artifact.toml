kind = "web"
previewPath = "/"
title = "AI Health Assistant"
version = "1.0.0"
id = "artifacts/health-assistant"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25086

[services.development]
run = "pnpm --filter @workspace/health-assistant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/health-assistant", "run", "build" ]
publicDir = "artifacts/health-assistant/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25086"
BASE_PATH = "/"
